<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="referrer" content="no-referrer-when-downgrade">
<title>直播间</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#0f1420;overflow:hidden}
  #frame{display:block;width:100%;height:100%;border:0}
  #tip{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:#0f1420;color:#9aa4b2;
       font:15px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif;transition:opacity .25s;text-align:center;padding:0 24px}
  #tip.hide{opacity:0;pointer-events:none}
  #tip .spinner{width:34px;height:34px;margin:0 auto 14px;border-radius:50%;
       border:3px solid #232c40;border-top-color:#4c7bd0;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #openBtn{position:fixed;right:10px;bottom:12px;z-index:8;padding:6px 12px;border:0;border-radius:16px;
       background:rgba(60,72,100,.72);color:#dfe6f2;font:13px/1.4 system-ui,-apple-system,"PingFang SC",sans-serif;
       cursor:pointer;opacity:.85}
</style>
</head>
<body>
<iframe id="frame" src="about:blank" referrerpolicy="origin" allowfullscreen></iframe>
<button id="openBtn" type="button">打不开？点此直接打开</button>
<div id="tip"><div><div class="spinner"></div>正在进入直播间…</div></div>
<script>
(function(){
  /* ================== 配置区 ==================
   * TARGET：目标页面完整链接（换房间/换域名时改这里）
   * MODE：'iframe' 嵌入模式（地址栏保持壳地址）；
   *       'redirect' 跳转模式（直接顶层跳到目标页，适合目标页需要
   *       微信授权登录/支付的场景——OAuth 页禁止被 iframe 嵌入） */
  var TARGET = 'https://pub.oqtris.cn/#/pages/webinar/index?webinarId=1000145734&eNo=A1070&rn=647274';
  var MODE = 'redirect';
  /* =========================================== */

  var frame = document.getElementById('frame');
  var tip = document.getElementById('tip');
  var openBtn = document.getElementById('openBtn');

  if (MODE === 'redirect') {
    location.replace(TARGET);
    return;
  }

  frame.src = TARGET;
  frame.addEventListener('load', function(){ setTimeout(function(){ tip.classList.add('hide'); }, 250); });
  setTimeout(function(){ tip.classList.add('hide'); }, 6000);

  /* 内嵌模式下功能异常（登录/支付）时的自救出口：顶层直接打开 */
  openBtn.addEventListener('click', function(){ location.href = TARGET; });
})();
</script>
</body>
</html>
